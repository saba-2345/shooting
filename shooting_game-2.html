<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>スペースシューター</title>
    <style>
/* ===== 基本スタイル ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    touch-action: none;
}

#gameCanvas {
    display: block;
    background: linear-gradient(to bottom, #000428, #004e92);
    margin: 0 auto;
    touch-action: none;
}

/* ===== UI（ゲーム情報） ===== */
#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    z-index: 10;
}

.weapon-name {
    color: #00ffff;
}

/* ===== タイトルに戻るボタン ===== */
.back-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 100px;
    height: 50px;
    border: 3px solid #ffaa00;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.8);
    color: #ffaa00;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    z-index: 15;
    text-shadow: 1px 1px 2px #000;
    box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
    display: none;
    touch-action: manipulation;
}

/* ===== ボスUI ===== */
.boss-ui {
    display: none;
    position: absolute;
    top: 20px;
    right: 20px;
    color: white;
    text-align: right;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    z-index: 10;
}

.boss-warning-text {
    font-size: 24px;
    color: #ff0000;
    font-weight: bold;
}

.boss-name {
    font-size: 18px;
    color: #ffaa00;
}

/* ===== ゲームオーバー画面 ===== */
.game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    font-size: 32px;
    display: none;
    z-index: 20;
}

.final-score {
    font-size: 24px;
    margin-top: 10px;
}

.restart-btn {
    margin-top: 20px;
    padding: 15px 40px;
    font-size: 24px;
    background: #00ff00;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #000;
}

.restart-btn:active {
    background: #00cc00;
}

/* ===== ステージクリア表示 ===== */
.stage-clear {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #00ff00;
    font-size: 48px;
    display: none;
    z-index: 20;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
    font-weight: bold;
}

/* ===== ボス警告表示 ===== */
.boss-warning {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #ff0000;
    font-size: 64px;
    display: none;
    z-index: 20;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
    font-weight: bold;
    animation: pulse 0.5s infinite;
}

.boss-warning-sub {
    font-size: 48px;
}

/* ===== 必殺ゲージ ===== */
.special-ui {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    width: 260px;
}

.special-label {
    color: #ffaa00;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 1px 1px 3px #000;
    margin-bottom: 4px;
}

.special-bar-bg {
    background: #222;
    border: 2px solid #555;
    border-radius: 8px;
    height: 18px;
    overflow: hidden;
}

.special-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #ff6600, #ffff00);
    border-radius: 6px;
    transition: width 0.15s;
}

/* ===== 必殺技ボタン（ゲーム中） ===== */
.special-btn-game {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 4px solid #888;
    background: radial-gradient(circle, #333, #111);
    color: #888;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
    text-shadow: 1px 1px 2px #000;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    user-select: none;
    -webkit-user-select: none;
}

.special-btn-label {
    font-size: 11px;
}

/* ===== 星エフェクト ===== */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.1); }
}

/* ===== スタート画面 ===== */
.start-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #001133, #003366);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    overflow-y: auto;
    padding: 20px 0;
}

.game-title {
    color: #00ffff;
    font-size: 48px;
    font-weight: bold;
    text-shadow: 3px 3px 8px #000, 0 0 20px #00ffff;
    margin-bottom: 30px;
}

.section-title {
    color: #ffaa00;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px #000;
}

.selection-row {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
}

/* ===== 機体選択 ===== */
.ship-option {
    width: 100px;
    height: 100px;
    border: 3px solid #555;
    border-radius: 10px;
    background: #111;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
}

.ship-option canvas {
    margin-bottom: 5px;
}

.ship-name {
    font-size: 12px;
    font-weight: bold;
}

.ship-desc {
    color: #aaa;
    font-size: 10px;
}

/* ===== 難易度選択 ===== */
.difficulty-btn {
    width: 90px;
    height: 60px;
    border: 3px solid #555;
    border-radius: 8px;
    background: #111;
    color: #aaa;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-sub {
    font-size: 11px;
}

/* ===== 必殺技選択（スタート画面） ===== */
.special-btn {
    width: 90px;
    height: 70px;
    border: 3px solid #555;
    border-radius: 8px;
    background: #111;
    color: #aaa;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    padding: 5px;
}

/* ===== STARTボタン・説明書ボタン ===== */
.start-btn {
    width: 200px;
    height: 60px;
    border: 4px solid #ffff00;
    border-radius: 12px;
    background: linear-gradient(to bottom, #664400, #443300);
    color: #ffff00;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 2px 2px 4px #000;
    box-shadow: 0 0 20px #ffaa00;
    margin-top: 20px;
}

.manual-btn {
    margin-top: 20px;
    width: 150px;
    height: 45px;
    border: 3px solid #00ffff;
    border-radius: 10px;
    background: rgba(0, 50, 50, 0.8);
    color: #00ffff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 1px 1px 2px #000;
}

/* ===== 説明書モーダル ===== */
.manual-modal {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    z-index: 200;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.manual-content {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    color: #fff;
}

.manual-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.manual-header h2 {
    color: #00ffff;
    font-size: 28px;
    margin: 0;
}

.close-btn {
    width: 40px;
    height: 40px;
    border: 2px solid #ff0000;
    border-radius: 50%;
    background: #330000;
    color: #ff0000;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

.manual-section {
    background: rgba(0, 30, 60, 0.6);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    border: 2px solid #0088ff;
}

.manual-section.warning {
    background: rgba(60, 0, 0, 0.6);
    border-color: #ff0000;
}

.manual-section h3 {
    color: #ffaa00;
    font-size: 20px;
    margin: 0 0 10px 0;
}

.manual-section.warning h3 {
    color: #ff6666;
}

.manual-section p {
    margin: 5px 0;
    line-height: 1.6;
}

.manual-close-btn {
    width: 100%;
    height: 50px;
    border: 3px solid #00ff00;
    border-radius: 10px;
    background: #003300;
    color: #00ff00;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
}

</style>
</head>
<body>
    <!-- ゲーム情報UI（左上） -->
    <div id="ui">
        <div>ステージ: <span id="stage">1</span></div>
        <div>スコア: <span id="score">0</span></div>
        <div>HP: <span id="hp">100</span></div>
        <div>撃破数: <span id="kills">0</span></div>
        <div>武器: Lv<span id="weaponLevel">1</span> <span id="weaponName" class="weapon-name">単発</span></div>
    </div>
    
    <!-- タイトルに戻るボタン -->
    <button id="backToStartBtn" class="back-btn">⬅ タイトル</button>
    
    <!-- ボスUI -->
    <div id="bossUI" class="boss-ui">
        <div class="boss-warning-text">⚠️ BOSS ⚠️</div>
        <div class="boss-name" id="bossName"></div>
        <div>BOSS HP: <span id="bossHP">0</span></div>
    </div>
    
    <!-- ゲームオーバー画面 -->
    <div id="gameOver" class="game-over">
        <div>ゲームオーバー！</div>
        <div class="final-score">最終スコア: <span id="finalScore">0</span></div>
        <div id="highScoreList" style="
            margin: 12px auto; width: 90%; max-width: 360px;
            background: rgba(0,0,50,0.7); border: 1px solid #336;
            border-radius: 8px; padding: 10px; text-align: left;">
        </div>
        <button id="restartBtn" class="restart-btn">リスタート</button>
    </div>
    
    <!-- ステージクリア表示 -->
    <div id="stageClear" class="stage-clear">STAGE CLEAR!</div>
    
    <!-- ボス警告表示 -->
    <div id="bossWarning" class="boss-warning">
        WARNING!<br>
        <span class="boss-warning-sub">BOSS APPROACHING</span>
    </div>
    
    <!-- 必殺ゲージ -->
    <div id="specialUI" class="special-ui">
        <div class="special-label">⚡ 必殺ゲージ <span id="specialPct">0</span>%</div>
        <div class="special-bar-bg">
            <div id="specialBar" class="special-bar"></div>
        </div>
    </div>
    
    <!-- 必殺技ボタン -->
    <button id="specialBtn" class="special-btn-game">
        ⚡<br>必殺技<br><span id="specialBtnLabel" class="special-btn-label">チャージ中</span>
    </button>
    
    <!-- スタート画面 -->
    <div id="startScreen" class="start-screen">
        <div class="game-title">SPACE SHOOTER</div>
        <div id="titleBest" style="color:#ffaa00;font-size:16px;margin-bottom:20px;text-shadow:1px 1px 3px #000;"></div>
        
        <div class="section-title">機体を選択</div>
        <div id="shipSelection" class="selection-row">
            <div class="ship-option selected" data-ship="0">
                <canvas width="60" height="60"></canvas>
                <div class="ship-name" style="color: #00ff00;">アロー</div>
                <div class="ship-desc">バランス型</div>
            </div>
            <div class="ship-option" data-ship="1">
                <canvas width="60" height="60"></canvas>
                <div class="ship-name" style="color: #ff00ff;">ブリッツ</div>
                <div class="ship-desc">速度特化</div>
            </div>
            <div class="ship-option" data-ship="2">
                <canvas width="60" height="60"></canvas>
                <div class="ship-name" style="color: #ff8800;">タンク</div>
                <div class="ship-desc">HP重視</div>
            </div>
        </div>
        
        <div class="section-title">難易度を選択</div>
        <div id="difficultySelection" class="selection-row">
            <button class="difficulty-btn" data-difficulty="easy">EASY<br><span class="btn-sub">敵少なめ</span></button>
            <button class="difficulty-btn selected" data-difficulty="normal">NORMAL<br><span class="btn-sub">標準</span></button>
            <button class="difficulty-btn" data-difficulty="hard">HARD<br><span class="btn-sub">敵多数</span></button>
        </div>
        
        <div class="section-title">必殺技を選択</div>
        <div id="specialSelection" class="selection-row">
            <button class="special-btn selected" data-special="destroy">💥<br>全破壊<br><span class="btn-sub">敵全滅</span></button>
            <button class="special-btn" data-special="invincible">🛡️<br>無敵<br><span class="btn-sub">3秒間</span></button>
            <button class="special-btn" data-special="barrage">🌟<br>弾幕<br><span class="btn-sub">大量射撃</span></button>
        </div>
        
        <button id="startGameBtn" class="start-btn">START</button>
        <div style="display:flex; gap:15px; margin-top:20px;">
            <button id="manualBtn" class="manual-btn">📖 説明書</button>
            <button id="rankingBtn" class="manual-btn" style="border-color:#ffaa00; color:#ffaa00; background:rgba(50,30,0,0.8);">🏆 ランキング</button>
        </div>
    </div>
    
    <!-- 説明書モーダル -->
    <div id="manualModal" class="manual-modal">
        <div class="manual-content">
            <div class="manual-header">
                <h2>📖 ゲーム説明書</h2>
                <button id="closeManualBtn" class="close-btn">✕</button>
            </div>
            <div id="manualSections"></div>
            <button id="closeManualBtn2" class="manual-close-btn">閉じる</button>
        </div>
    </div>
    
    <!-- ランキングモーダル -->
    <div id="rankingModal" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%;
         background:rgba(0,0,0,0.95); z-index:200; overflow-y:auto; -webkit-overflow-scrolling:touch;">
        <div style="max-width:520px; margin:30px auto; padding:20px; color:#fff;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="color:#ffaa00; font-size:28px; margin:0;">🏆 ハイスコア</h2>
                <button id="closeRankingBtn" style="width:40px; height:40px; border:2px solid #ff0000;
                    border-radius:50%; background:#330000; color:#ff0000; font-size:24px;
                    font-weight:bold; cursor:pointer;">✕</button>
            </div>
            <div id="rankingList" style="margin-bottom:20px;"></div>
            <button id="clearScoreBtn" style="width:100%; height:44px; border:2px solid #555;
                border-radius:8px; background:#111; color:#888; font-size:14px; cursor:pointer;
                margin-bottom:12px;">🗑 スコアをリセット</button>
            <button id="closeRankingBtn2" style="width:100%; height:50px; border:3px solid #ffaa00;
                border-radius:10px; background:#332200; color:#ffaa00; font-size:18px;
                font-weight:bold; cursor:pointer;">閉じる</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- スクリプト読み込み（順序重要） -->
<script>

// ===== js/config.js =====
/**
 * ゲーム設定・定数定義
 */

// ===== ゲーム全体の設定 =====
const GAME_CONFIG = {
    KILLS_REQUIRED_FOR_BOSS: 100,
    SPECIAL_GAUGE_MAX: 100,
    BASE_SHOOT_COOLDOWN: 200,
    INVINCIBLE_FRAMES: {
        BULLET: 30,    // 弾被弾時 0.5秒（短縮）
        ENEMY:  40,    // 敵接触時 0.67秒（短縮）
        BOSS:   50     // ボス接触時 0.83秒（短縮）
    },
    PLAYER_DAMAGE: {
        BULLET: 8,     // 5 → 8
        ENEMY:  15,    // 10 → 15
        BOSS:   30     // 20 → 30
    },
    HP_RECOVERY_AMOUNT: 20   // 30 → 20
};

// ===== 機体タイプ定義 =====
const SHIP_TYPES = [
    {
        name: 'アロー',
        color: '#00ff00',
        hp: 100,
        speed: 5,
        shootCooldown: 200,
        draw(ctx, p, specialActive) {
            ctx.fillStyle = specialActive ? '#00ffff' : this.color;
            ctx.strokeStyle = specialActive ? '#ffffff' : '#00cc00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - p.height / 2);
            ctx.lineTo(p.x - p.width / 2, p.y + p.height / 2);
            ctx.lineTo(p.x + p.width / 2, p.y + p.height / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    },
    {
        name: 'ブリッツ',
        color: '#ff00ff',
        hp: 80,
        speed: 7,
        shootCooldown: 150,
        draw(ctx, p, specialActive) {
            ctx.fillStyle = specialActive ? '#00ffff' : this.color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            // 細身の三角形
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - p.height / 2 - 5);
            ctx.lineTo(p.x - p.width / 3, p.y + p.height / 2);
            ctx.lineTo(p.x + p.width / 3, p.y + p.height / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // ウイング
            [-1, 1].forEach(side => {
                ctx.beginPath();
                ctx.moveTo(p.x + side * p.width / 3, p.y);
                ctx.lineTo(p.x + side * (p.width / 2 + 5), p.y + 10);
                ctx.lineTo(p.x + side * p.width / 3, p.y + 15);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });
        }
    },
    {
        name: 'タンク',
        color: '#ff8800',
        hp: 150,
        speed: 3.5,
        shootCooldown: 250,
        draw(ctx, p, specialActive) {
            ctx.fillStyle = specialActive ? '#00ffff' : this.color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            // 幅広機体
            ctx.fillRect(p.x - p.width / 2, p.y - p.height / 2, p.width, p.height);
            ctx.strokeRect(p.x - p.width / 2, p.y - p.height / 2, p.width, p.height);
            // 頭部
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - p.height / 2);
            ctx.lineTo(p.x - 10, p.y - p.height / 2 - 8);
            ctx.lineTo(p.x + 10, p.y - p.height / 2 - 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }
];

// ===== 難易度設定 =====
const DIFFICULTIES = {
    easy:   { spawnMultiplier: 0.6, enemySpeedMultiplier: 0.8, enemyHPMultiplier: 0.8 },
    normal: { spawnMultiplier: 1.0, enemySpeedMultiplier: 1.0, enemyHPMultiplier: 1.0 },
    hard:   { spawnMultiplier: 1.8, enemySpeedMultiplier: 1.4, enemyHPMultiplier: 1.6 }  // 全項目強化
};

// ===== 敵タイプ定義 =====
const ENEMY_TYPES = {
    normal:  { color: '#ff0000', hp: 2, speed: 2,   size: 40, score: 10, pattern: 'straight', gaugeGain: 4  },
    fast:    { color: '#ff00ff', hp: 1, speed: 4,   size: 30, score: 15, pattern: 'zigzag',   gaugeGain: 3  },
    tank:    { color: '#ff8800', hp: 5, speed: 1.5, size: 50, score: 30, pattern: 'straight', gaugeGain: 10 },
    shooter: { color: '#00ff88', hp: 3, speed: 2.5, size: 35, score: 25, pattern: 'circle',   gaugeGain: 6,  canShoot: true }
};

// ===== 必殺技色設定 =====
const SPECIAL_COLORS = {
    destroy:    { ready: '#ff0000', active: '#ff6600', shadow: '#ff0000' },
    invincible: { ready: '#00ffff', active: '#00aaff', shadow: '#00ffff' },
    barrage:    { ready: '#ffff00', active: '#ffaa00', shadow: '#ffff00' }
};

// ===== 武器名定義 =====
const WEAPON_NAMES = ['単発', '2連射', '3方向', '追尾', '5方向', 'レーザー', '全方位'];
const MAX_WEAPON_LEVEL = 7;


// ===== js/utils.js =====
/**
 * 共通ユーティリティ関数
 */

// ===== 矩形同士の衝突判定 =====
function isColliding(a, b) {
    return Math.abs(a.x - b.x) < (a.width + b.width) / 2 &&
           Math.abs(a.y - b.y) < (a.height + b.height) / 2;
}

// ===== 2点間の距離計算 =====
function distance(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
}

// ===== 弾の色を武器レベルから取得 =====
function getBulletColor(level) {
    const colors = ['#ffff00', '#00ffff', '#ff88ff', '#ff8800', '#00ff88', '#ff4444', '#ffffff'];
    return colors[Math.min(level - 1, colors.length - 1)];
}

// ===== 背景の星を生成 =====
function createStars() {
    for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(star);
    }
}

// ===== 値を範囲内に制限 =====
function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

/**
 * エンティティ管理
 * プレイヤー、オプションミサイル、アイテム
 */

// ===== プレイヤー描画 =====
function drawPlayer() {
    const p = game.player;
    const lv = game.weaponLevel;
    
    // 無敵タイマー減少
    if (game.invincibleTimer > 0) {
        game.invincibleTimer--;
    }
    
    // 無敵中の点滅
    if (game.invincibleTimer > 0 && Math.floor(game.invincibleTimer / 5) % 2 === 0) {
        return; // 描画スキップで点滅
    }
    
    // オプションミサイルの描画・更新
    drawOptions(p, lv);
    
    // 機体本体描画
    const shipType = SHIP_TYPES[game.selectedShip];
    shipType.draw(ctx, p, game.specialActive);
    
    // エンジン炎
    drawEngineFlame(p);
}

// ===== エンジン炎 =====
function drawEngineFlame(p) {
    const flameH = 8 + Math.random() * 6;
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(p.x - 8, p.y + p.height / 2, 16, flameH);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(p.x - 4, p.y + p.height / 2, 8, flameH * 0.5);
}

// ===== オプションミサイル =====
function drawOptions(p, lv) {
    const optionCount = clamp(lv - 2, 0, 4);
    
    if (optionCount === 0) {
        game.options = [];
        return;
    }
    
    const positions = [
        { ox: -45, oy: 0  },
        { ox:  45, oy: 0  },
        { ox: -30, oy: 20 },
        { ox:  30, oy: 20 }
    ];
    
    // オプション数を調整
    while (game.options.length < optionCount) {
        const pos = positions[game.options.length];
        game.options.push({ x: p.x + pos.ox, y: p.y + pos.oy });
    }
    while (game.options.length > optionCount) {
        game.options.pop();
    }
    
    // オプションを描画＆追従
    game.options.forEach((opt, i) => {
        const target = positions[i];
        opt.x += (p.x + target.ox - opt.x) * 0.12;
        opt.y += (p.y + target.oy - opt.y) * 0.12;
        
        // 小型機の描画
        ctx.fillStyle = '#00ccff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(opt.x, opt.y - 10);
        ctx.lineTo(opt.x - 8, opt.y + 8);
        ctx.lineTo(opt.x + 8, opt.y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // コア
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(opt.x, opt.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // オプションから弾発射
    const now = Date.now();
    if (now - game.lastOptionShot > game.shootCooldown * 1.2) {
        game.options.forEach(opt => {
            game.bullets.push({
                x: opt.x, y: opt.y - 10,
                width: 4, height: 12,
                speed: 11, vx: 0,
                color: '#00ccff',
                isOption: true
            });
        });
        game.lastOptionShot = now;
    }
}

// ===== アイテム生成 =====
function spawnItem(x, y) {
    if (Math.random() < 0.20) {  // 30% → 20%
        const types = ['weapon', 'hp'];
        const type = types[Math.floor(Math.random() * types.length)];
        game.items.push({
            x, y,
            width: 25, height: 25,
            speed: 2,
            type
        });
    }
}

// ===== アイテムの更新・描画 =====
function updateItems() {
    game.items = game.items.filter(item => {
        item.y += item.speed;
        if (item.y > canvas.height + 50) return false;
        
        drawItem(item);
        
        // プレイヤーとの衝突
        if (isColliding(item, game.player)) {
            applyItemEffect(item);
            return false;
        }
        return true;
    });
}

function drawItem(item) {
    if (item.type === 'weapon') {
        drawWeaponItem(item);
    } else if (item.type === 'hp') {
        drawHPItem(item);
    }
}

function drawWeaponItem(item) {
    // 青い星
    ctx.fillStyle = '#00ffff';
    ctx.strokeStyle = '#0088ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
        const x = item.x + Math.cos(angle) * item.width / 2;
        const y = item.y + Math.sin(angle) * item.height / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // 「W」の文字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('W', item.x, item.y);
}

function drawHPItem(item) {
    // 赤いハート
    ctx.fillStyle = '#ff6b6b';
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(item.x, item.y + 8);
    ctx.bezierCurveTo(item.x, item.y + 3, item.x - 10, item.y - 5, item.x - 10, item.y);
    ctx.bezierCurveTo(item.x - 10, item.y - 8, item.x - 5, item.y - 10, item.x, item.y - 6);
    ctx.bezierCurveTo(item.x + 5, item.y - 10, item.x + 10, item.y - 8, item.x + 10, item.y);
    ctx.bezierCurveTo(item.x + 10, item.y - 5, item.x, item.y + 3, item.x, item.y + 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
}

function applyItemEffect(item) {
    if (item.type === 'weapon') {
        if (game.weaponLevel < MAX_WEAPON_LEVEL) {
            game.weaponLevel++;
            updateWeaponLevel();
            spawnFloatText(game.player.x, game.player.y - 40, `WEAPON UP!`, {
                color: '#00ffff', size: 22, life: 60, vy: -1.8, vx: 0
            });
        }
        game.score += 50;
        spawnFloatText(item.x, item.y, '+50', { color: '#00ffff', size: 16, life: 35 });
    } else if (item.type === 'hp') {
        game.player.hp = Math.min(game.player.maxHp, game.player.hp + GAME_CONFIG.HP_RECOVERY_AMOUNT);
        updateHP();
        game.score += 20;
        spawnFloatText(item.x, item.y, `+${GAME_CONFIG.HP_RECOVERY_AMOUNT} HP`, {
            color: '#ff6b6b', size: 18, life: 40, vy: -1.5
        });
        spawnFloatText(item.x, item.y + 20, '+20', { color: '#ffaa00', size: 14, life: 30 });
    }
    updateScore();
}

// ===== 現在選択中の武器バリアントを管理 =====
// game.weaponVariant に現在のバリアントオブジェクトを保持する
// (game state に追加される)

// ===== レベルに応じたバリアントをランダム選択して返す =====
function pickWeaponVariant(level) {
    const lv = clamp(level, 1, MAX_WEAPON_LEVEL);
    const variants = WEAPON_VARIANTS[lv];
    return variants[Math.floor(Math.random() * variants.length)];
}

// ===== 弾を発射 =====
function shoot() {
    const now = Date.now();
    if (now - game.lastShot <= game.shootCooldown) return;

    const variant = game.weaponVariant || WEAPON_VARIANTS[1][0];
    const newBullets = variant.make(game.player);
    game.bullets.push(...newBullets);

    game.lastShot = now;
}

// ===== 弾の更新と描画 =====
function updateBullets() {
    game.bullets = game.bullets.filter(bullet => {
        if (bullet.isEnemy) {
            return updateEnemyBullet(bullet);
        }
        return updatePlayerBullet(bullet);
    });
}

// ===== 敵の弾の更新 =====
function updateEnemyBullet(bullet) {
    // 敵弾のホーミング処理（タイタンのミサイル）
    if (bullet.homing) {
        bullet.homeTimer = (bullet.homeTimer || 0) + 1;
        if (bullet.homeTimer < 30) {
            const dx = game.player.x - bullet.x;
            const dy = game.player.y - bullet.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 0) {
                bullet.vx += (dx / dist) * 0.5;
                bullet.vy = (bullet.vy || 0) + (dy / dist) * 0.5;
                bullet.vx = clamp(bullet.vx, -6, 6);
                bullet.vy = clamp(bullet.vy || 0, -6, 6);
            }
        }
        bullet.y -= bullet.speed * 0.2;
        bullet.x += bullet.vx;
        bullet.y += (bullet.vy || 0);
    } else {
        bullet.y -= bullet.speed;
        bullet.x += bullet.vx;
        if (bullet.vy !== undefined) bullet.y += bullet.vy;
    }
    
    // 画面外チェック
    if (bullet.y > canvas.height || bullet.y < -20 ||
        bullet.x < -20 || bullet.x > canvas.width + 20) return false;
    
    // 描画
    if (bullet.homing) {
        ctx.fillStyle = '#ff8800';
        ctx.beginPath();
        ctx.moveTo(bullet.x, bullet.y - 8);
        ctx.lineTo(bullet.x - 5, bullet.y + 6);
        ctx.lineTo(bullet.x + 5, bullet.y + 6);
        ctx.closePath();
        ctx.fill();
    } else {
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.width / 2, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // プレイヤー衝突判定
    if (game.invincibleTimer <= 0 && isColliding(bullet, game.player)) {
        damagePlayer(GAME_CONFIG.PLAYER_DAMAGE.BULLET, GAME_CONFIG.INVINCIBLE_FRAMES.BULLET);
        return false;
    }
    return true;
}

// ===== プレイヤーの弾の更新 =====
function updatePlayerBullet(bullet) {
    // ホーミング処理
    if (bullet.homing) {
        applyHoming(bullet);
    }
    
    bullet.y -= bullet.speed;
    bullet.x += (bullet.vx || 0);
    
    // 画面外チェック
    if (bullet.y < 0 || bullet.x < -20 || bullet.x > canvas.width + 20) return false;
    
    // 描画
    drawPlayerBullet(bullet);
    return true;
}

function applyHoming(bullet) {
    bullet.homeTimer = (bullet.homeTimer || 0) + 1;
    if (bullet.homeTimer >= 20) return;
    
    // 最も近い敵を探す
    let nearest = game.boss;
    let minDist = nearest ? distance(nearest.x, nearest.y, bullet.x, bullet.y) : Infinity;
    
    game.enemies.forEach(e => {
        const d = distance(e.x, e.y, bullet.x, bullet.y);
        if (d < minDist) { minDist = d; nearest = e; }
    });
    
    if (nearest) {
        const dx = nearest.x - bullet.x;
        const dy = nearest.y - bullet.y;
        const dist = Math.hypot(dx, dy);
        bullet.vx = clamp(bullet.vx + (dx / dist) * 0.8, -4, 4);
    }
}

function drawPlayerBullet(bullet) {
    const color = bullet.color || '#ffff00';
    
    if (bullet.laser) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.fillRect(bullet.x - bullet.width / 2, bullet.y, bullet.width, bullet.height);
        ctx.shadowBlur = 0;
    } else if (bullet.homing) {
        // ひし形
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(bullet.x, bullet.y - bullet.height / 2);
        ctx.lineTo(bullet.x + bullet.width / 2, bullet.y);
        ctx.lineTo(bullet.x, bullet.y + bullet.height / 2);
        ctx.lineTo(bullet.x - bullet.width / 2, bullet.y);
        ctx.closePath();
        ctx.fill();
    } else {
        ctx.fillStyle = color;
        ctx.fillRect(bullet.x - bullet.width / 2, bullet.y, bullet.width, bullet.height);
    }
}

// ===== プレイヤーへのダメージ処理（共通化） =====
function damagePlayer(amount, invincibleFrames) {
    game.player.hp -= amount;
    game.invincibleTimer = invincibleFrames;

    // ダメージ数字表示（赤・大きめ）
    spawnFloatText(game.player.x, game.player.y - 30, `-${amount}`, {
        color: '#ff2222', size: 26, life: 50, vy: -2
    });
    
    // 武器レベルダウン（バリアントも再選択）
    if (game.weaponLevel > 1) {
        game.weaponLevel--;
        updateWeaponLevel();
    }
    updateHP();
}

/**
 * 敵管理
 */

// ===== 敵を生成 =====
function spawnEnemy() {
    if (game.isBossStage || game.isStageClearing) return;
    
    const stats = getEnemyStats();
    const diff = DIFFICULTIES[game.difficulty];
    
    if (Math.random() >= stats.spawnRate * diff.spawnMultiplier) return;
    
    const type = selectEnemyType();
    const enemyType = ENEMY_TYPES[type];
    const stageBonus = Math.floor((game.stage - 1) / 2);
    
    game.enemies.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -30,
        width: enemyType.size,
        height: enemyType.size,
        speed: (enemyType.speed + (game.stage - 1) * 0.2) * diff.enemySpeedMultiplier,
        hp:    Math.ceil((enemyType.hp + stageBonus) * diff.enemyHPMultiplier),
        maxHp: Math.ceil((enemyType.hp + stageBonus) * diff.enemyHPMultiplier),
        type, color: enemyType.color, score: enemyType.score,
        pattern: enemyType.pattern, canShoot: enemyType.canShoot,
        moveTimer: 0, lastShot: 0
    });
}

// ===== 敵の出現タイプを選択 =====
function selectEnemyType() {
    const rand = Math.random();
    if (game.stage >= 2) {
        if (rand < 0.3) return 'fast';
        if (rand < 0.5) return 'tank';
        if (rand < 0.7 && game.stage >= 3) return 'shooter';
    } else {
        if (rand < 0.2) return 'fast';
    }
    return 'normal';
}

// ===== 敵のステータス取得（撃破数による強化） =====
function getEnemyStats() {
    const level = Math.floor(game.kills / 15);
    return {
        hp: 2 + level,
        speed: 2 + Math.random() * 2 + level * 0.3,
        spawnRate: Math.min(0.04, 0.02 + level * 0.003)
    };
}

// ===== 敵の更新と描画 =====
function updateEnemies() {
    game.enemies = game.enemies.filter(enemy => {
        enemy.moveTimer += 0.1;
        moveEnemy(enemy);
        
        // 画面外チェック
        if (isOffScreen(enemy)) return false;
        
        // 射撃型の弾発射
        if (enemy.canShoot) shootEnemyBullet(enemy);
        
        drawEnemy(enemy);
        
        // プレイヤー衝突
        if (game.invincibleTimer <= 0 && isColliding(enemy, game.player)) {
            damagePlayer(GAME_CONFIG.PLAYER_DAMAGE.ENEMY, GAME_CONFIG.INVINCIBLE_FRAMES.ENEMY);
            return false;
        }
        return true;
    });
}

// ===== 敵の移動パターン =====
function moveEnemy(enemy) {
    if (enemy.pattern === 'straight') {
        enemy.y += enemy.speed;
    } else if (enemy.pattern === 'zigzag') {
        enemy.y += enemy.speed;
        enemy.x += Math.sin(enemy.moveTimer) * 3;
    } else if (enemy.pattern === 'circle') {
        enemy.y += enemy.speed * 0.7;
        enemy.x += Math.cos(enemy.moveTimer * 2) * 2;
    }
}

function isOffScreen(enemy) {
    return enemy.y > canvas.height + 50 || enemy.x < -50 || enemy.x > canvas.width + 50;
}

// ===== 敵の弾発射 =====
function shootEnemyBullet(enemy) {
    if (enemy.y <= 50 || enemy.y >= canvas.height - 200) return;
    
    const now = Date.now();
    if (now - enemy.lastShot <= 2000) return;
    
    game.bullets.push({
        x: enemy.x, y: enemy.y + 20,
        width: 6, height: 12,
        speed: -5, vx: 0,
        isEnemy: true
    });
    enemy.lastShot = now;
}

// ===== 敵の描画 =====
function drawEnemy(enemy) {
    // 本体
    ctx.fillStyle = enemy.color;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.width / 2, 0, Math.PI * 2);
    ctx.fill();
    
    // HPバー
    if (enemy.hp < enemy.maxHp) {
        drawEnemyHPBar(enemy);
    }
    
    // 目
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(enemy.x - 8, enemy.y - 5, 5, 0, Math.PI * 2);
    ctx.arc(enemy.x + 8, enemy.y - 5, 5, 0, Math.PI * 2);
    ctx.fill();
}

function drawEnemyHPBar(enemy) {
    const barWidth = enemy.width;
    const barY = enemy.y - enemy.height / 2 - 10;
    
    ctx.fillStyle = '#333';
    ctx.fillRect(enemy.x - barWidth / 2, barY, barWidth, 4);
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(enemy.x - barWidth / 2, barY, barWidth * (enemy.hp / enemy.maxHp), 4);
}


// ===== js/bosses.js =====
/**
 * ボス管理
 */

// ===== ボスタイプ定義 =====
const BOSS_TYPES = [
    {
        // ===== ガーディアン =====
        // 新移動: フェーズに応じて左右揺れ→高速ジグザグ→プレイヤー追尾突進
        // 新技:  フェーズ2「バリアリング（自分を中心に回転弾）」
        //        フェーズ3「レーザーウォール（画面横断レーザー）」
        name: 'ガーディアン',
        colors: ['#ff00ff', '#ff8800', '#ff0000'],
        draw(ctx, boss) {
            const color = this.colors[boss.phase - 1];
            // バリアリング描画（フェーズ2以降）
            if (boss.phase >= 2 && boss.barrierAngle !== undefined) {
                const ringCount = boss.phase === 3 ? 8 : 5;
                for (let i = 0; i < ringCount; i++) {
                    const a = boss.barrierAngle + (i / ringCount) * Math.PI * 2;
                    const bx = boss.x + Math.cos(a) * 65;
                    const by = boss.y + Math.sin(a) * 65;
                    ctx.fillStyle = boss.phase === 3 ? '#ff0000' : '#ff8800';
                    ctx.beginPath();
                    ctx.arc(bx, by, 7, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            // 本体
            ctx.fillStyle = color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(boss.x, boss.y, boss.width / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // 目
            ctx.fillStyle = boss.phase === 3 ? '#ff0000' : '#fff';
            ctx.beginPath();
            ctx.arc(boss.x - 20, boss.y - 10, 10, 0, Math.PI * 2);
            ctx.arc(boss.x + 20, boss.y - 10, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(boss.x - 20, boss.y - 10, 5, 0, Math.PI * 2);
            ctx.arc(boss.x + 20, boss.y - 10, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            if (boss.phase === 3) ctx.arc(boss.x, boss.y + 10, 20, 0, Math.PI);
            else ctx.arc(boss.x, boss.y + 20, 20, Math.PI, 0);
            ctx.stroke();
        },
        shoot(boss, bullets) {
            if (boss.phase === 1) {
                // 3方向
                for (let i = -1; i <= 1; i++)
                    bullets.push({ x: boss.x + i * 30, y: boss.y + 40, width: 8, height: 16, speed: -4, vx: i * 2, isEnemy: true });
            } else if (boss.phase === 2) {
                // 5方向 + バリアリング弾を射出
                for (let i = -2; i <= 2; i++)
                    bullets.push({ x: boss.x + i * 20, y: boss.y + 40, width: 8, height: 16, speed: -5, vx: i * 2.5, isEnemy: true });
                // バリアリングから弾を射出
                if (boss.barrierAngle !== undefined) {
                    for (let i = 0; i < 5; i++) {
                        const a = boss.barrierAngle + (i / 5) * Math.PI * 2;
                        const bx = boss.x + Math.cos(a) * 65;
                        const by = boss.y + Math.sin(a) * 65;
                        bullets.push({ x: bx, y: by, width: 6, height: 6, speed: -3, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, isEnemy: true });
                    }
                }
            } else {
                // 円形弾幕
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2 + boss.moveTimer;
                    bullets.push({ x: boss.x, y: boss.y, width: 9, height: 9, speed: -4, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4, isEnemy: true });
                }
                // レーザーウォール: 水平に弾を並べる
                if (!boss.laserCooldown || Date.now() - boss.laserCooldown > 4000) {
                    for (let x = 0; x < canvas.width; x += 40) {
                        if (Math.abs(x - boss.x) > 80) { // ボス直下は空ける
                            bullets.push({ x, y: boss.y + 50, width: 12, height: 12, speed: -6, vx: 0, isEnemy: true, isLaser: true });
                        }
                    }
                    boss.laserCooldown = Date.now();
                }
            }
        },
        move(boss) {
            if (boss.phase === 1) {
                // 滑らかな左右揺れ
                boss.x += Math.sin(boss.moveTimer) * 2.5;
            } else if (boss.phase === 2) {
                // 速いジグザグ + バリアリング回転
                boss.x += Math.sin(boss.moveTimer * 2) * 3;
                boss.barrierAngle = (boss.barrierAngle || 0) + 0.04;
            } else {
                // プレイヤー追尾 + 時々突進
                boss.barrierAngle = (boss.barrierAngle || 0) + 0.08;
                if (!boss.dashTimer) boss.dashTimer = 0;
                boss.dashTimer++;
                if (boss.dashTimer < 40) {
                    // 突進
                    boss.x += (game.player.x - boss.x) * 0.05;
                    boss.y += (game.player.y - boss.y) * 0.03;
                    boss.y = clamp(boss.y, 100, 300);
                } else if (boss.dashTimer > 80) {
                    boss.dashTimer = 0;
                }
                // 引き戻し
                boss.x += Math.sin(boss.moveTimer * 1.5) * 1.5;
            }
        }
    },
    {
        // ===== スネーク =====
        // 新移動: フェーズに応じて波動→8の字→テレポート（瞬間移動）
        // 新技:  フェーズ2「扇形連続射撃」
        //        フェーズ3「テレポート直後に全方位弾」
        name: 'スネーク',
        colors: ['#00ff88', '#ffaa00', '#ff4400'],
        draw(ctx, boss) {
            const color = this.colors[boss.phase - 1];
            // テレポート残像
            if (boss.afterImages) {
                boss.afterImages.forEach((img, i) => {
                    ctx.globalAlpha = (i + 1) / boss.afterImages.length * 0.3;
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(img.x, img.y - 40);
                    ctx.lineTo(img.x - 35, img.y + 40);
                    ctx.lineTo(img.x + 35, img.y + 40);
                    ctx.closePath();
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
            ctx.fillStyle = color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(boss.x, boss.y - boss.height / 2);
            ctx.lineTo(boss.x - boss.width / 2, boss.y + boss.height / 2);
            ctx.lineTo(boss.x + boss.width / 2, boss.y + boss.height / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(boss.x - 15, boss.y + 5, 8, 0, Math.PI * 2);
            ctx.arc(boss.x + 15, boss.y + 5, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(boss.x - 15, boss.y + 5, 4, 0, Math.PI * 2);
            ctx.arc(boss.x + 15, boss.y + 5, 4, 0, Math.PI * 2);
            ctx.fill();
        },
        shoot(boss, bullets) {
            if (boss.phase === 1) {
                // 回転弾4方向
                const count = 4;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2 + boss.moveTimer * 2;
                    bullets.push({ x: boss.x, y: boss.y, width: 7, height: 14, speed: -3.5, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 2, isEnemy: true });
                }
            } else if (boss.phase === 2) {
                // 扇形連続射撃（正面に集中）
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2 + boss.moveTimer * 2;
                    bullets.push({ x: boss.x, y: boss.y, width: 7, height: 14, speed: -4, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 3, isEnemy: true });
                }
                // 追加: 扇形（下向き5発）
                for (let i = -2; i <= 2; i++) {
                    const angle = Math.PI / 2 + i * 0.3;
                    bullets.push({ x: boss.x, y: boss.y + 40, width: 8, height: 8, speed: -5, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3, isEnemy: true });
                }
            } else {
                // 12方向全弾 + テレポート直後は追加弾幕
                const count = 12;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2 + boss.moveTimer * 2;
                    bullets.push({ x: boss.x, y: boss.y, width: 7, height: 14, speed: -4.5, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 3, isEnemy: true });
                }
            }
        },
        move(boss) {
            if (boss.phase === 1) {
                boss.x += Math.sin(boss.moveTimer * 1.5) * 3;
                boss.y = boss.targetY + Math.sin(boss.moveTimer * 0.8) * 30;
            } else if (boss.phase === 2) {
                // 8の字移動
                boss.x = canvas.width / 2 + Math.sin(boss.moveTimer) * (canvas.width / 3.5);
                boss.y = boss.targetY + Math.sin(boss.moveTimer * 2) * 40;
            } else {
                // テレポート
                if (!boss.teleportTimer) boss.teleportTimer = 0;
                boss.teleportTimer++;
                // 残像を記録
                if (!boss.afterImages) boss.afterImages = [];
                boss.afterImages.push({ x: boss.x, y: boss.y });
                if (boss.afterImages.length > 5) boss.afterImages.shift();
                
                if (boss.teleportTimer > 90) {
                    // 瞬間移動
                    boss.x = 60 + Math.random() * (canvas.width - 120);
                    boss.y = 100 + Math.random() * 150;
                    boss.teleportTimer = 0;
                    boss.afterImages = [];
                    // テレポート直後に全方位弾
                    for (let i = 0; i < 16; i++) {
                        const angle = (i / 16) * Math.PI * 2;
                        game.bullets.push({ x: boss.x, y: boss.y, width: 8, height: 8, speed: -3, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5, isEnemy: true });
                    }
                } else {
                    boss.x += Math.sin(boss.moveTimer * 2) * 4;
                    boss.y = boss.targetY + Math.cos(boss.moveTimer) * 50;
                }
            }
        }
    },
    {
        // ===== タイタン =====
        // 新移動: フェーズに応じてゆっくり→パターン移動→画面端ダッシュ
        // 新技:  フェーズ2「ミサイル4発同時発射」
        //        フェーズ3「画面端から弾の壁を展開」
        name: 'タイタン',
        colors: ['#4488ff', '#aa44ff', '#ff2244'],
        draw(ctx, boss) {
            const color = this.colors[boss.phase - 1];
            // 弾の壁予告ライン（フェーズ3）
            if (boss.phase === 3 && boss.wallWarning) {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(0, boss.wallY);
                ctx.lineTo(canvas.width, boss.wallY);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.fillStyle = color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.fillRect(boss.x - boss.width / 2, boss.y - boss.height / 2, boss.width, boss.height);
            ctx.strokeRect(boss.x - boss.width / 2, boss.y - boss.height / 2, boss.width, boss.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(boss.x - boss.width / 2, boss.y);
            ctx.lineTo(boss.x + boss.width / 2, boss.y);
            ctx.moveTo(boss.x, boss.y - boss.height / 2);
            ctx.lineTo(boss.x, boss.y + boss.height / 2);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(boss.x - 18, boss.y - 8, 9, 0, Math.PI * 2);
            ctx.arc(boss.x + 18, boss.y - 8, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(boss.x - 18, boss.y - 8, 4, 0, Math.PI * 2);
            ctx.arc(boss.x + 18, boss.y - 8, 4, 0, Math.PI * 2);
            ctx.fill();
        },
        shoot(boss, bullets) {
            const cols = boss.phase === 3 ? 5 : boss.phase === 2 ? 3 : 2;
            for (let i = 0; i < cols; i++) {
                const ox = (i - (cols - 1) / 2) * 25;
                bullets.push({ x: boss.x + ox, y: boss.y + boss.height / 2, width: 8, height: 8, speed: -(4 + boss.phase), vx: 0, isEnemy: true });
            }
            if (boss.phase >= 2) {
                // 横方向
                bullets.push({ x: boss.x - boss.width / 2, y: boss.y, width: 8, height: 8, speed: -3, vx: -5, isEnemy: true });
                bullets.push({ x: boss.x + boss.width / 2, y: boss.y, width: 8, height: 8, speed: -3, vx: 5, isEnemy: true });
                // ミサイル4発（追尾）
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;
                    bullets.push({ x: boss.x + Math.cos(angle) * 30, y: boss.y + Math.sin(angle) * 30, width: 7, height: 14, speed: 8, vx: 0, isEnemy: true, homing: true, homeTimer: 0 });
                }
            }
            if (boss.phase === 3 && boss.wallCooldown && Date.now() - boss.wallCooldown > 5000) {
                // 弾の壁
                boss.wallY = 200 + Math.random() * (canvas.height / 2 - 200);
                boss.wallWarning = true;
                setTimeout(() => {
                    for (let x = 0; x < canvas.width; x += 35) {
                        game.bullets.push({ x, y: boss.wallY, width: 14, height: 14, speed: -7, vx: 0, isEnemy: true });
                    }
                    boss.wallWarning = false;
                }, 1000);
                boss.wallCooldown = Date.now();
            }
            if (!boss.wallCooldown) boss.wallCooldown = Date.now();
        },
        move(boss) {
            if (boss.phase === 1) {
                boss.x += Math.sin(boss.moveTimer * 0.7) * 1.5;
            } else if (boss.phase === 2) {
                // 台形パターン移動
                const t = boss.moveTimer % (Math.PI * 2);
                boss.x = canvas.width / 2 + Math.sin(t) * (canvas.width / 3);
                boss.y = boss.targetY + Math.abs(Math.sin(t * 0.5)) * 60;
            } else {
                // 画面端ダッシュ
                if (!boss.dashDir) boss.dashDir = 1;
                if (!boss.dashSpeed) boss.dashSpeed = 3;
                boss.x += boss.dashDir * boss.dashSpeed;
                boss.dashSpeed = Math.min(boss.dashSpeed + 0.08, 8);
                if (boss.x > canvas.width - 80) { boss.dashDir = -1; boss.dashSpeed = 3; }
                if (boss.x < 80) { boss.dashDir = 1; boss.dashSpeed = 3; }
                boss.y = boss.targetY + Math.sin(boss.moveTimer) * 30;
            }
        }
    },
    {
        // ===== ファントム =====
        // 新移動: フェーズに応じて大きく往復→不規則な螺旋→分身（影）表示
        // 新技:  フェーズ2「集束レーザー（プレイヤー狙い撃ち）」
        //        フェーズ3「分身弾（影から弾が出る）」
        name: 'ファントム',
        colors: ['#cc00ff', '#ff6600', '#ff0000'],
        draw(ctx, boss) {
            const color = this.colors[boss.phase - 1];
            // 分身（影）の描画（フェーズ3）
            if (boss.phase === 3 && boss.shadows) {
                boss.shadows.forEach((sh, i) => {
                    ctx.globalAlpha = 0.35;
                    ctx.fillStyle = '#ff0000';
                    drawPhantomShape(ctx, sh.x, sh.y, boss.moveTimer + i, boss.width);
                });
                ctx.globalAlpha = 1;
            }
            // 本体
            drawPhantomShape(ctx, boss.x, boss.y, boss.moveTimer, boss.width);
            function drawPhantomShape(ctx, x, y, t, w) {
                ctx.fillStyle = color;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const outerAngle = (i / 6) * Math.PI * 2 - Math.PI / 2 + t * 0.5;
                    const innerAngle = outerAngle + Math.PI / 6;
                    const ox = x + Math.cos(outerAngle) * w / 2;
                    const oy = y + Math.sin(outerAngle) * w / 2;
                    const ix = x + Math.cos(innerAngle) * w / 4;
                    const iy = y + Math.sin(innerAngle) * w / 4;
                    if (i === 0) ctx.moveTo(ox, oy);
                    else ctx.lineTo(ox, oy);
                    ctx.lineTo(ix, iy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x - 12, y - 5, 8, 0, Math.PI * 2);
                ctx.arc(x + 12, y - 5, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x - 12, y - 5, 4, 0, Math.PI * 2);
                ctx.arc(x + 12, y - 5, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            // 集束レーザー予告線（フェーズ2）
            if (boss.phase >= 2 && boss.laserWarning) {
                ctx.strokeStyle = 'rgba(255, 100, 0, 0.6)';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(boss.x, boss.y);
                ctx.lineTo(game.player.x, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        },
        shoot(boss, bullets) {
            if (boss.phase === 1) {
                // 螺旋3方向
                const count = 3;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2 + boss.moveTimer * 3;
                    bullets.push({ x: boss.x, y: boss.y, width: 9, height: 9, speed: -3, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 3, isEnemy: true });
                }
            } else if (boss.phase === 2) {
                // 螺旋4方向
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2 + boss.moveTimer * 3;
                    bullets.push({ x: boss.x, y: boss.y, width: 9, height: 9, speed: -3.5, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 3, isEnemy: true });
                }
                // 集束レーザー（プレイヤー狙い）
                if (!boss.laserTimer) boss.laserTimer = 0;
                boss.laserTimer++;
                if (boss.laserTimer > 60) {
                    boss.laserWarning = true;
                }
                if (boss.laserTimer > 90) {
                    boss.laserWarning = false;
                    const dx = game.player.x - boss.x;
                    const dy = game.player.y - boss.y;
                    const dist = Math.hypot(dx, dy);
                    for (let i = 0; i < 5; i++) {
                        bullets.push({ x: boss.x, y: boss.y, width: 7, height: 18, speed: -8, vx: (dx / dist) * 8 + (Math.random() - 0.5), vy: (dy / dist) * 2, isEnemy: true });
                    }
                    boss.laserTimer = 0;
                }
            } else {
                // 螺旋6方向
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + boss.moveTimer * 3;
                    bullets.push({ x: boss.x, y: boss.y, width: 9, height: 9, speed: -4, vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 4, isEnemy: true });
                }
                // 分身からも弾
                if (boss.shadows) {
                    boss.shadows.forEach(sh => {
                        for (let i = 0; i < 4; i++) {
                            const angle = (i / 4) * Math.PI * 2 + boss.moveTimer * 2;
                            bullets.push({ x: sh.x, y: sh.y, width: 7, height: 7, speed: -3, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4, isEnemy: true });
                        }
                    });
                }
            }
        },
        move(boss) {
            if (boss.phase === 1) {
                boss.x = canvas.width / 2 + Math.sin(boss.moveTimer) * (canvas.width / 3);
                boss.y = boss.targetY + Math.cos(boss.moveTimer * 1.3) * 40;
            } else if (boss.phase === 2) {
                // 不規則な螺旋
                boss.x = canvas.width / 2 + Math.sin(boss.moveTimer * 1.3) * (canvas.width / 3);
                boss.y = boss.targetY + Math.sin(boss.moveTimer * 0.7) * 60 + Math.cos(boss.moveTimer * 1.9) * 20;
            } else {
                // 分身を生成・更新
                if (!boss.shadows) boss.shadows = [
                    { x: boss.x - 100, y: boss.y + 50 },
                    { x: boss.x + 100, y: boss.y + 50 }
                ];
                boss.shadows[0].x = boss.x - 80 + Math.sin(boss.moveTimer * 1.7) * 40;
                boss.shadows[0].y = boss.targetY + 60 + Math.cos(boss.moveTimer * 1.3) * 30;
                boss.shadows[1].x = boss.x + 80 + Math.sin(boss.moveTimer * 2.1) * 40;
                boss.shadows[1].y = boss.targetY + 60 + Math.sin(boss.moveTimer * 0.9) * 30;
                // 本体は速い8の字
                boss.x = canvas.width / 2 + Math.sin(boss.moveTimer * 1.8) * (canvas.width / 2.8);
                boss.y = boss.targetY + Math.cos(boss.moveTimer * 1.8) * 55;
            }
        }
    }
];

// ===== ボスを生成 =====
function spawnBoss() {
    const bossHP = 80 + game.stage * 50;  // 50+stage*30 → 80+stage*50
    const typeIndex = Math.floor(Math.random() * BOSS_TYPES.length);
    
    game.boss = {
        x: canvas.width / 2, y: -100,
        width: 80, height: 80,
        speed: 1, hp: bossHP, maxHp: bossHP,
        phase: 1, moveTimer: 0,
        lastShot: 0, targetY: 150,
        typeIndex
    };
    
    document.getElementById('bossUI').style.display = 'block';
    document.getElementById('bossName').textContent = BOSS_TYPES[typeIndex].name;
    updateBossHP();
}

// ===== ボスの更新 =====
function updateBoss() {
    if (!game.boss) return;
    
    const boss = game.boss;
    boss.moveTimer += 0.05;
    const bossType = BOSS_TYPES[boss.typeIndex];
    
    // 登場アニメ
    if (boss.y < boss.targetY) {
        boss.y += 2;
        boss.x = canvas.width / 2;
        bossType.draw(ctx, boss);
        drawBossHPBar(boss);
        return;
    }
    
    // 移動
    bossType.move(boss);
    boss.x = clamp(boss.x, 80, canvas.width - 80);
    
    // フェーズ更新
    updateBossPhase(boss);
    
    // 攻撃
    const now = Date.now();
    const shootInterval = 1500 - boss.phase * 200;
    if (now - boss.lastShot > shootInterval) {
        bossType.shoot(boss, game.bullets);
        boss.lastShot = now;
    }
    
    // 描画
    bossType.draw(ctx, boss);
    drawBossHPBar(boss);
    
    // プレイヤー衝突
    if (game.invincibleTimer <= 0 && isColliding(boss, game.player)) {
        damagePlayer(GAME_CONFIG.PLAYER_DAMAGE.BOSS, GAME_CONFIG.INVINCIBLE_FRAMES.BOSS);
    }
}

function updateBossPhase(boss) {
    const hpPercent = boss.hp / boss.maxHp;
    if (hpPercent < 0.3) boss.phase = 3;
    else if (hpPercent < 0.6) boss.phase = 2;
    else boss.phase = 1;
}

// ===== ボスHPバー描画 =====
function drawBossHPBar(boss) {
    const hpPercent = boss.hp / boss.maxHp;
    const barWidth = canvas.width * 0.8;
    const barX = canvas.width * 0.1;
    const barY = 60;
    const barHeight = 20;
    
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);
    
    const grad = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
    if (hpPercent > 0.6) {
        grad.addColorStop(0, '#00ff00'); grad.addColorStop(1, '#88ff00');
    } else if (hpPercent > 0.3) {
        grad.addColorStop(0, '#ffaa00'); grad.addColorStop(1, '#ff8800');
    } else {
        grad.addColorStop(0, '#ff0000'); grad.addColorStop(1, '#cc0000');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barWidth, barHeight);
}

// ===== ボス撃破処理 =====
function defeatBoss() {
    // 大爆発
    const bossType = BOSS_TYPES[game.boss.typeIndex];
    for (let i = 0; i < 4; i++) {
        setTimeout(() => {
            if (!game.particles) return;
            spawnExplosion(
                game.boss ? game.boss.x + (Math.random()-0.5)*80 : canvas.width/2,
                game.boss ? game.boss.y + (Math.random()-0.5)*80 : 200,
                { count: 30, speed: 7, size: 8, life: 60,
                  colors: ['#ff0000','#ff6600','#ffff00','#fff','#ff88ff'] }
            );
        }, i * 200);
    }
    game.score += 500 + game.stage * 200;
    updateScore();
    
    // アイテム5個ドロップ
    for (let i = 0; i < 5; i++) {
        spawnItem(game.boss.x + (Math.random() - 0.5) * 100, game.boss.y);
    }
    
    game.boss = null;
    game.isBossStage = false;
    document.getElementById('bossUI').style.display = 'none';
    showStageClear();
}

// ===== 必殺技定義（戦略パターン） =====
const SPECIAL_ATTACKS = {
    // 1. 全破壊
    destroy: {
        duration: 60,
        execute() {
            flashScreen('brightness(3)');
            
            // 全敵を破壊
            game.enemies.forEach(e => {
                spawnItem(e.x, e.y);
                game.score += e.score;
                game.kills++;
                game.stageKills++;
            });
            game.enemies = [];
            updateScore();
            updateKills();
            
            // ボスへのダメージ
            if (game.boss) {
                game.boss.hp -= 30;
                updateBossHP();
                if (game.boss.hp <= 0) defeatBoss();
            }
        },
        drawEffect(p) {
            drawSpecialAura(p, '#ffff00', 50, 20, 0.4, 0.5);
        }
    },
    
    // 2. 無敵状態
    invincible: {
        duration: 180,
        execute() {
            game.invincibleTimer = 180;
            flashScreen('brightness(2) hue-rotate(180deg)', 200);
        },
        drawEffect(p) {
            ctx.save();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';
            ctx.globalAlpha = 0.6 + Math.sin(game.specialTimer * 0.2) * 0.3;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 45, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(p.x, p.y, 55, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    },
    
    // 3. 弾幕
    barrage: {
        duration: 180,
        execute() {
            // 持続的に弾を発射するため、execute時は何もしない
        },
        drawEffect(p) {
            // 毎フレーム弾発射
            for (let i = 0; i < 5; i++) {
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.8;
                const spd = 10 + Math.random() * 5;
                game.bullets.push({
                    x: p.x + (Math.random() - 0.5) * 30,
                    y: p.y - 10,
                    width: 8, height: 8,
                    speed: spd * Math.cos(angle + Math.PI / 2),
                    vx: Math.cos(angle) * spd,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 60%)`,
                    special: true
                });
            }
            
            drawSpecialAura(p, '#ffff00', 40, 0, 0.3, 0);
        }
    }
};

// ===== 共通：必殺技オーラ描画 =====
function drawSpecialAura(p, color, baseRadius, pulseRange, baseAlpha, alphaPulse) {
    ctx.save();
    ctx.shadowBlur = 30;
    ctx.shadowColor = color;
    ctx.globalAlpha = baseAlpha + Math.sin(game.specialTimer * 0.5) * alphaPulse;
    ctx.fillStyle = color;
    ctx.beginPath();
    const radius = baseRadius + Math.sin(game.specialTimer * 0.3) * pulseRange;
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// ===== 共通：画面フラッシュ =====
function flashScreen(filter, duration = 150) {
    canvas.style.transition = 'filter 0.1s';
    canvas.style.filter = filter;
    setTimeout(() => { canvas.style.filter = 'brightness(1)'; }, duration);
}

// ===== 必殺技発動 =====
function fireSpecial() {
    if (game.specialGauge < game.specialMax || game.specialActive || game.isGameOver) return;
    
    const special = SPECIAL_ATTACKS[game.selectedSpecial];
    if (!special) return;
    
    game.specialActive = true;
    game.specialGauge = 0;
    game.specialTimer = special.duration;
    
    special.execute();
    updateSpecialGauge();
}

// ===== 必殺技エフェクトの更新 =====
function updateSpecial() {
    if (!game.specialActive) return;
    
    game.specialTimer--;
    if (game.specialTimer <= 0) {
        game.specialActive = false;
        updateSpecialGauge();
        return;
    }
    
    const special = SPECIAL_ATTACKS[game.selectedSpecial];
    if (special) special.drawEffect(game.player);
}

// ===== ゲージを敵タイプに応じて加算 =====
function addSpecialGauge(enemyType) {
    const gain = ENEMY_TYPES[enemyType]?.gaugeGain || 8;
    game.specialGauge = Math.min(game.specialMax, game.specialGauge + gain);
    updateSpecialGauge();
}

// ===== STEP2: ハイスコア保存 =====

const HighScore = (() => {
    const KEY = 'spaceShooter_highScores';

    function load() {
        try { return JSON.parse(localStorage.getItem(KEY)) || []; }
        catch { return []; }
    }

    function save(scores) {
        try { localStorage.setItem(KEY, JSON.stringify(scores)); } catch {}
    }

    return {
        // スコアを追加して上位5件を保持、自己ベストか否かを返す
        add(score, stage, ship, difficulty) {
            const scores = load();
            const isNew  = scores.length === 0 || score > scores[0].score;
            scores.push({ score, stage, ship, difficulty, date: new Date().toLocaleDateString('ja-JP') });
            scores.sort((a, b) => b.score - a.score);
            save(scores.slice(0, 5));
            return isNew;
        },
        getAll() { return load(); },
        getBest() { const s = load(); return s.length ? s[0].score : 0; }
    };
})();

function renderHighScores() {
    const scores = HighScore.getAll();
    if (scores.length === 0) return '<p style="color:#888;">まだ記録がありません</p>';
    return scores.map((s, i) => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;
             border-bottom:1px solid #224;font-size:14px;">
            <span style="color:${i===0?'#ffff00':'#aaa'}">${i===0?'🏆':'　'} #${i+1}</span>
            <span style="color:#fff;font-weight:bold;">${s.score.toLocaleString()}pt</span>
            <span style="color:#00ff88;">St.${s.stage}</span>
            <span style="color:#aaa;">${SHIP_TYPES[s.ship]?.name ?? '-'} / ${s.difficulty}</span>
            <span style="color:#666;">${s.date}</span>
        </div>`).join('');
}

function gameOver() {
    game.isGameOver = true;
    BGM.stop();

    const isNewBest = HighScore.add(
        game.score, game.stage,
        game.selectedShip, game.difficulty
    );

    const best = HighScore.getBest();
    document.getElementById('finalScore').textContent = game.score.toLocaleString();
    document.getElementById('gameOver').querySelector('div:first-child').innerHTML =
        `${isNewBest ? '🏆 NEW RECORD!<br>' : ''}ゲームオーバー！<br>
         <span style="font-size:18px;">到達ステージ: ${game.stage}</span><br>
         <span style="font-size:15px;color:#ffaa00;">ベスト: ${best.toLocaleString()}pt</span>`;

    // ハイスコア一覧を表示
    document.getElementById('highScoreList').innerHTML = renderHighScores();
    // ランキングモーダルも更新（開いている場合に備えて）
    renderRankingList();
    document.getElementById('gameOver').style.display = 'block';
    document.getElementById('backToStartBtn').style.display = 'none';
}
